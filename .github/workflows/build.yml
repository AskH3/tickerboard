name: Build Fire TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the Android project
        run: |
          echo "Repo contents:"; find . -maxdepth 3 -not -path './.git*' | sort
          SG=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SG" ]; then
            echo "::error::No android folder found. Upload the 'android' folder from the zip (Add file > Upload files) so it sits next to index.html."
            exit 1
          fi
          echo "ANDROID_DIR=$(dirname "$SG")" >> "$GITHUB_ENV"
          echo "Using Android project at $(dirname "$SG")"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          URL="https://${OWNER}.github.io/${REPO}/"
          echo "Board URL baked into app: $URL"
          cd "$ANDROID_DIR"
          gradle assembleRelease -PboardUrl="$URL" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/tickerboard-tv.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ticker Board TV (build ${{ github.run_number }})
          make_latest: true
          files: tickerboard-tv.apk
