name: Build Ticker Board

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'   # refresh WSJ headlines + macro calendar about every 15 min

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------- the board page + news.json + macro.json (every push and every 15 min) ----------
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unpack the zip
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "::error::No .zip found. Drag tickerboard-tv.zip into the repo."; exit 1; fi
          rm -rf _src && mkdir _src && unzip -q "$Z" -d _src
          IX=$(find _src -name index.html -not -path '*/android/*' | head -1)
          [ -n "$IX" ] || { echo "::error::No index.html inside $Z"; exit 1; }
          mkdir -p _site && cp "$IX" _site/index.html && touch _site/.nojekyll

      - name: Fetch WSJ headlines and the economic calendar
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import json, os, re, html, time, email.utils, urllib.request
          import xml.etree.ElementTree as ET
          UA = {'User-Agent': 'Mozilla/5.0 (TickerBoard personal dashboard)'}
          site = os.environ['SITE'].lower()

          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=25).read()

          def keep_old(name):
              # if a source fails, keep whatever is already live so the board never goes blank
              try:
                  open('_site/' + name, 'wb').write(get(f'{site}/{name}'))
                  print(name, 'kept previous copy')
              except Exception as e:
                  print(name, 'no previous copy', e)

          # --- WSJ (Dow Jones public RSS) ---
          feeds = [('Markets', 'RSSMarketsMain'), ('Business', 'WSJcomUSBusiness'),
                   ('Tech', 'RSSWSJD'), ('Economy', 'socialeconomyfeed')]
          items, seen = [], set()
          for sec, f in feeds:
              try:
                  root = ET.fromstring(get('https://feeds.content.dowjones.io/public/rss/' + f))
                  n = 0
                  for it in root.iter('item'):
                      t = html.unescape((it.findtext('title') or '').strip())
                      if not t or t in seen:
                          continue
                      seen.add(t)
                      d = re.sub(r'<[^>]+>', '', html.unescape(it.findtext('description') or '')).strip()
                      pd = it.findtext('pubDate')
                      try:
                          ts = int(email.utils.parsedate_to_datetime(pd).timestamp())
                      except Exception:
                          ts = int(time.time())
                      items.append({'source': 'WSJ', 'section': sec, 'headline': t, 'summary': d,
                                    'datetime': ts, 'url': (it.findtext('link') or '').strip()})
                      n += 1
                  print('WSJ', sec, n, 'stories')
              except Exception as e:
                  print('WSJ', sec, 'failed:', e)
          if items:
              items.sort(key=lambda a: -a['datetime'])
              json.dump({'updated': int(time.time()), 'items': items[:150]}, open('_site/news.json', 'w'))
          else:
              keep_old('news.json')

          # --- economic calendar (Forex Factory weekly JSON) ---
          try:
              ev = json.loads(get('https://nfs.faireconomy.media/ff_calendar_thisweek.json'))
              ev = [e for e in ev if e.get('country') == 'USD' and e.get('impact') in ('High', 'Medium')]
              json.dump({'updated': int(time.time()), 'events': ev}, open('_site/macro.json', 'w'))
              print('macro', len(ev), 'events')
          except Exception as e:
              print('macro failed:', e)
              keep_old('macro.json')
          PY
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-page:
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------- the Fire TV app (only when you upload, not on the 15-min refresh) ----------
  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unpack the zip
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -1)
          rm -rf _src && mkdir _src && unzip -q "$Z" -d _src
          SG=$(find _src -path '*android/settings.gradle' | head -1)
          [ -n "$SG" ] || { echo "::error::No android folder inside $Z"; exit 1; }
          echo "ANDROID_DIR=$(dirname "$SG")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          echo "Board URL baked into app: $URL"
          cd "$ANDROID_DIR"
          gradle assembleRelease -PboardUrl="$URL" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/tickerboard-tv.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ticker Board TV (build ${{ github.run_number }})
          make_latest: true
          files: tickerboard-tv.apk
